[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "match_predictor"
version = "0.1.0"
description = "A ML model built to predict results of English Premier League fixtures using data from past 5 seasons."
requires-python = ">=3.11"

dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "requests",
    "python-dotenv",
    "xgboost",
    "scipy",
    "beautifulsoup4",
    "curl_cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "notebook",
]

[tool.setuptools.packages.find]
where = ["src"]